syntax = "proto3";
package hooya;

import "hooya.proto";

service Control {
    rpc Version (VersionRequest) returns (VersionReply);
    rpc GetSystemInfo (SystemInfoRequest) returns (SystemInfoReply);
    rpc TagCid (TagCidRequest) returns (TagCidReply);
    rpc UntagCid (TagCidRequest) returns (TagCidReply);
    rpc Tags (TagsRequest) returns (TagsReply);
    rpc ContentAtCid (ContentAtCidRequest) returns (stream FileChunk);
    rpc CidThumbnail (CidThumbnailRequest) returns (stream FileChunk);
    rpc CidInfo (CidInfoRequest) returns (CidInfoReply);
    rpc ForgetFile (ForgetFileRequest) returns (ForgetFileReply);
    rpc RandomLocalFile (RandomLocalFileRequest) returns (RandomLocalFileReply);
    rpc Reimport (ReimportRequest) returns (ReimportReply);
    rpc AllFiles(AllFilesRequest) returns (AllFilesReply);
    rpc Search(SearchRequest) returns (SearchReply);
    // Given a search query, autocomplete the final term
    rpc SuggestTag(SuggestTagRequest) returns (SuggestTagReply);
    rpc AllTags(AllTagsRequest) returns (AllTagsReply);

    // upload session interface
    rpc StartUploadSession (StartUploadSessionRequest) returns (StartUploadSessionReply);
    rpc UploadChunk (UploadChunkRequest) returns (UploadChunkReply);
    rpc CompleteUpload (CompleteUploadRequest) returns (CompleteUploadReply);
    rpc GetUploadStatus (GetUploadStatusRequest) returns (GetUploadStatusReply);

    rpc ProcessingEvents (ProcessingEventsRequest) returns (stream ProcessingEvent);
    rpc InstanceEvents (InstanceEventsRequest) returns (stream ProcessingEvent);

    // deprecated
    rpc LocalFilePage (LocalFilePageRequest) returns (LocalFilePageReply);

    // deprecated
    rpc StreamToFilestore (stream FileChunk) returns (StreamToFilestoreReply);
}

message VersionRequest { }

message VersionReply {
    uint64 major_version = 1;
    uint64 minor_version = 2;
    uint64 patch_version = 3;
    string pre_version = 4;
}

message ReimportRequest {
    bytes cid = 1;
}

message ReimportReply {
}

message RandomLocalFileRequest {
    uint32 count = 1;
}

message RandomLocalFileReply {
    repeated File file = 1;
}

message SuggestTagRequest {
    // Existing query to filter by
    repeated TagQuery tag_query = 1;
    // namespace:descriptor to autocomplete
    string suggest_string = 2;
    int64 max_suggest = 3;
    uint32 visibility_filter = 4;
}

message SuggestTagReply {
    // Suggested tag given constraints
    repeated TagSuggestion tag_suggestion = 1;
    // Constraints
    repeated TagQuery tag_constraints = 2;
}

message TagSuggestion {
    optional string namespace = 1;
    string descriptor = 2;
    int64 count = 3;
    int64 distance = 4;
}

message SearchRequest {
    SearchQuery search_query = 1;
    string page_token = 2;
    uint32 page_size = 3;
    ResultsSortOrder sort_order = 4;
    bool reverse_order = 5;
    uint32 visibility_filter = 6;
}

message SearchQuery {
    // This will get more complex if I add search operators like OR
    // … these are joined with AND only for now
    repeated TagQuery tag_query = 1;
    optional I64Query size = 2;
    optional string mimetype = 3;

    oneof ext_attr {
        ImageQuery image_query = 4;
        VideoQuery video_query = 5;
    }
}

message TagQuery {
    optional string namespace = 1;
    string descriptor = 2;
    bool negated = 3;
}

message ImageQuery {
    optional float aspect_ratio = 1;
    optional I64Query height = 2;
    optional I64Query width = 3;
    // colors…
    // wavelet…
}

message I64Query {
    int64 magnitude = 1;
    oneof description {
        bool is_max = 2;
        bool is_min = 3;
        bool is_exact = 4;
    }
}

message VideoQuery {
    optional float aspect_ratio = 1;
    optional I64Query height = 2;
    optional I64Query width = 3;
    optional I64Query duration = 4;
}

message SearchReply {
    string next_page_token = 1;
    string final_page_token = 2;
    repeated File files = 3;
}

message AllTagsRequest {
    string page_token = 1;
    uint32 page_size = 2;
    TagResultsSortOrder sort_order = 3;
    bool reverse_order = 4;
    uint32 visibility_filter = 5;
}

message AllTagsReply {
    string next_page_token = 1;
    string final_page_token = 2;
    repeated TagInfo tags = 3;
}

message TagInfo {
    string namespace = 1;
    string descriptor = 2;
    int64 count = 3;
}

message AllFilesRequest {
    string page_token = 1;
    uint32 page_size = 2;
    ResultsSortOrder sort_order = 3;
    bool reverse_order = 4;
    uint32 visibility_filter = 5;
}

message AllFilesReply {
    string next_page_token = 1;
    string final_page_token = 2;
    repeated File files = 3;
}

enum TagResultsSortOrder {
    most_files = 0;
}

enum ResultsSortOrder {
    most_recently_indexed = 0;
    // most_tags = 1;
    // largest_filesize = 2;
}

// deprecated
message LocalFilePageRequest {
    uint32 page_size = 1;
    string page_token = 2;
    bool oldest_first = 3;
}

// deprecated
message LocalFilePageReply {
    repeated File file = 1;
    string next_page_token = 2;
}

message PageRequest {
    uint32 page_size = 1;
    string page_token = 2;
}

message FileChunk {
    bytes data = 1;
}

// deprecated
message StreamToFilestoreReply {
    bytes cid = 1;
}

message TagsRequest {
    bytes cid = 1;
}

message TagsReply {
    repeated Tag tags = 1;
}

message TagCidRequest {
    bytes cid = 1;
    repeated Tag tags = 2;
}

message TagCidReply {
}

message ContentAtCidRequest {
    bytes cid = 1;
}

message CidThumbnailRequest {
    bytes source_cid = 1;
    uint32 long_edge = 2;
}

message ForgetFileRequest {
    bytes cid = 1;
}

message ForgetFileReply { }

message CidInfoRequest {
    bytes cid = 1;
}

message CidInfoReply {
    File file = 1;
}

// Upload session messages
message StartUploadSessionRequest {
    optional uint64 size = 1;
    optional string mimetype = 2;
    uint32 chunk_size = 3;
}

message StartUploadSessionReply {
    string upload_id = 1;
    uint32 chunk_size = 2;  // confirmed chunk size, may be capped if request > max
}

message UploadChunkRequest {
    string upload_id = 1;
    string chunk_index = 2;
    bytes data = 3;
}

message UploadChunkReply {
    UploadStatus status = 1;
    optional string error_message = 2;
    uint64 bytes_received = 3;
    string next_chunk_index = 4;
}

message CompleteUploadRequest {
    string upload_id = 1;
    repeated Tag tags = 2;
}

message CompleteUploadReply {
    bytes cid = 1;
    File file = 2;
}

message GetUploadStatusRequest {
    string upload_id = 1;
}

message GetUploadStatusReply {
    UploadStatus status = 1;
    uint64 bytes_received = 2;
    uint64 expected_size = 3;
    string next_chunk_index = 4;
    optional string error_message = 5;
}

enum UploadStatus {
    UPLOAD_IN_PROGRESS = 0;
    UPLOAD_COMPLETE = 1;
    UPLOAD_ERROR = 2;
}

// processing events
message ProcessingEventsRequest {
    bytes cid = 1;
}

// instance events
message InstanceEventsRequest {
}

message ProcessingEvent {
    bytes cid = 1;
    ProcessingStatus event_type = 2;
    optional string error_message = 3;
    // metadata for specific event types
    optional uint32 long_edge = 4;  // for THUMBNAIL_GENERATED, VIDEO_PREVIEW_GENERATED
    optional string mimetype = 5;   // for THUMBNAIL_GENERATED, VIDEO_PREVIEW_GENERATED
}

// system info messages
message SystemInfoRequest { }

message SystemInfoReply {
    // instance configuration
    string instance_name = 1;
    string operator_name = 2;
    string node_id = 3;

    // system statistics
    SystemStats stats = 4;

    // daemon version information
    VersionInfo daemon_version = 5;
}

message SystemStats {
    int64 files_indexed = 1;
    int64 associations_count = 2;
    int64 tags_count = 3;
}

message VersionInfo {
    string version_string = 1;
    uint64 major = 2;
    uint64 minor = 3;
    uint64 patch = 4;
    string pre = 5;
}
